# Builds Toomu automatically.
#  - Android APKs: every push to main or by hand (arm64 only, for speed);
#    every v* tag (arm64 + armv7). Analyze + tests run alongside the build.
#  - iOS (unsigned .ipa): v* tags or by hand only — macOS minutes count 10×
#    on private repositories.
#  - A v* tag (e.g. v1.2.0) also publishes a GitHub Release with the files.
#
# Release signing (optional, recommended — phones only update an app signed
# with the same key), repository Secrets:
#   ANDROID_KEYSTORE_BASE64  base64 of your .jks   (base64 -i upload.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ios:
        description: Also build iOS
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLATFORMS: ${{ startsWith(github.ref, 'refs/tags/v') && 'android-arm,android-arm64' || 'android-arm64' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Release key (if configured)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APKs are signed with a CI debug key (phones can't update a build signed differently)."
          fi

      - run: flutter pub get

      - name: Build APKs (trimmed, obfuscated; see tool/build_release.sh)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform "$PLATFORMS" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=TOOMU_BUILD="ci ${GITHUB_SHA::7} $(date -u '+%m-%d %H:%M')"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/toomu-arm64-v8a.apk
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/toomu-armeabi-v7a.apk
          fi
          (cd build && zip -qr ../dist/debug-symbols-android.zip symbols)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: toomu-android
          path: dist/*
          retention-days: 14

  ios:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.ios)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Unsigned: install with your own Apple signing (e.g. AltStore /
      # Sideloadly) — App Store distribution needs certificates + profiles.
      - name: Build iOS (no code signing)
        run: |
          flutter build ios --release --no-codesign \
            --obfuscate --split-debug-info=build/symbols-ios \
            --dart-define=TOOMU_BUILD="ci ${GITHUB_SHA::7} ios"
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qr toomu-unsigned.ipa Payload && rm -rf Payload)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: toomu-ios
          path: dist/*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --title "Toomu ${GITHUB_REF_NAME}" \
            --notes "Built by CI from ${GITHUB_SHA::7}.
          - toomu-arm64-v8a.apk — most phones · toomu-armeabi-v7a.apk — older 32-bit phones
          - toomu-unsigned.ipa — iOS, unsigned (YouTube downloads up to 1080p; no TikTok downloads, bubble or PiP)
          - debug-symbols-*.zip — to read crash stack traces"
