# Builds Toomu automatically.
#  - Android APKs: every push to main or by hand (arm64 only, for speed);
#    every v* tag (arm64 + armv7). Analyze, the Dart tests (3 shards) and
#    the Kotlin tests run alongside the builds, each its own job; any
#    failure stops the release.
#  - Windows x64 (zip): every build, alongside Android.
#  - Every successful build of main publishes a GitHub Release under a new
#    tag (vYYYY.MM.DD-HHMM, Bangladesh time) with the APK and Windows zip; a pushed v* tag
#    publishes one under that tag with all files.
#
# Release signing (optional, recommended — phones only update an app signed
# with the same key), repository Secrets:
#   ANDROID_KEYSTORE_BASE64  base64 of your .jks   (base64 -i upload.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.1'

jobs:
  # Checks run as parallel jobs: analyze, the Dart tests (split in shards)
  # and the Kotlin tests, so none waits for another.
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub

  # Dart tests in TEST_SHARDS jobs at once, split by test file (each file is
  # compiled once, in one shard; package:test's --total-shards would
  # compile every file in every shard). Each job runs its files on all of
  # the runner's CPU cores (flutter's default leaves some idle).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # show every failing shard, not just the first
      matrix:
        shard: [0, 1, 2]
    env:
      TEST_SHARDS: 3
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Tests (shard ${{ matrix.shard }} of ${{ env.TEST_SHARDS }})
        run: |
          files=$(tool/test_shard.sh "${{ matrix.shard }}" "$TEST_SHARDS")
          echo "$files"
          flutter test --no-pub --concurrency="$(nproc)" $files

  # Kotlin unit tests (android/app/src/test), e.g. the yt-dlp file repair.
  # android/gradlew isn't in git: --config-only has Flutter write it
  # (and Gradle's settings) without building anything.
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Android unit tests
        run: |
          flutter build apk --config-only
          cd android && ./gradlew :app:testDebugUnitTest

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      PLATFORMS: ${{ startsWith(github.ref, 'refs/tags/v') && 'android-arm,android-arm64' || 'android-arm64' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Saves Gradle's caches after every main build (setup-java's cache only
      # saved when the Gradle files changed), so tasks such as R8 are reused
      # when only Dart code changed.
      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Release key (if configured)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APKs are signed with a CI debug key (phones can't update a build signed differently)."
          fi

      - run: flutter pub get

      # The app compares this with GitHub's latest release to offer updates.
      - name: Release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(TZ=Asia/Dhaka date '+%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APKs (trimmed, obfuscated; see tool/build_release.sh)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform "$PLATFORMS" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=TOOMU_BUILD="ci ${GITHUB_SHA::7} $(date -u '+%m-%d %H:%M')" \
            --dart-define=TOOMU_TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/toomu-arm64-v8a.apk
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/toomu-armeabi-v7a.apk
          fi
          (cd build && zip -qr ../dist/debug-symbols-android.zip symbols)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: toomu-android
          path: dist/*
          retention-days: 14

  # Windows x64: the app folder zipped (unzip anywhere, run toomu.exe).
  # yt-dlp, FFmpeg and Deno download on first launch (WindowsYtDlp).
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows
        run: |
          flutter build windows --release \
            --obfuscate --split-debug-info=build/symbols-windows \
            --dart-define=TOOMU_BUILD="ci ${GITHUB_SHA::7} windows"
          mkdir -p dist
          (cd build/windows/x64/runner/Release && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/dist/toomu-windows-x64.zip" .)
          (cd build && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/dist/debug-symbols-windows.zip" symbols-windows)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: toomu-windows
          path: dist/*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [analyze, test, kotlin, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.android.outputs.tag }}
        run: |
          tag="$TAG"
          notes="Built by CI from ${GITHUB_SHA::7}."
          [ -f dist/toomu-arm64-v8a.apk ] && notes+=$'\n- toomu-arm64-v8a.apk — most phones'
          [ -f dist/toomu-armeabi-v7a.apk ] && notes+=$'\n- toomu-armeabi-v7a.apk — older 32-bit phones'
          [ -f dist/toomu-windows-x64.zip ] && notes+=$'\n- toomu-windows-x64.zip — Windows 10/11 (unzip, run toomu.exe)'
          notes+=$'\n- debug-symbols-*.zip — to read crash stack traces'
          # A tag created with the workflow's token doesn't start another run.
          gh release create "$tag" dist/* --target "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" --title "Toomu $tag" --notes "$notes"
