# Builds Toomu automatically.
#  - Android APKs: every push to main or by hand (arm64 only, for speed);
#    every v* tag (arm64 + armv7). Analyze + Dart and Kotlin tests run
#    alongside the build (job "check"); a failure stops the release.
#  - iOS: turned off (see the commented-out ios job).
#  - Every successful build of main publishes a GitHub Release under a new
#    tag (vYYYY.MM.DD-HHMM, Bangladesh time) with the APK; a pushed v* tag
#    publishes one under that tag with all files.
#
# Release signing (optional, recommended — phones only update an app signed
# with the same key), repository Secrets:
#   ANDROID_KEYSTORE_BASE64  base64 of your .jks   (base64 -i upload.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # For the Kotlin unit tests.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

      # Kotlin unit tests (android/app/src/test), e.g. the yt-dlp file repair.
      # android/gradlew isn't in git: --config-only has Flutter write it
      # (and Gradle's settings) without building anything.
      - name: Android unit tests
        run: |
          flutter build apk --config-only
          cd android && ./gradlew :app:testDebugUnitTest

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      PLATFORMS: ${{ startsWith(github.ref, 'refs/tags/v') && 'android-arm,android-arm64' || 'android-arm64' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Saves Gradle's caches after every main build (setup-java's cache only
      # saved when the Gradle files changed), so tasks such as R8 are reused
      # when only Dart code changed.
      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Release key (if configured)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APKs are signed with a CI debug key (phones can't update a build signed differently)."
          fi

      - run: flutter pub get

      # The app compares this with GitHub's latest release to offer updates.
      - name: Release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(TZ=Asia/Dhaka date '+%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APKs (trimmed, obfuscated; see tool/build_release.sh)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform "$PLATFORMS" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=TOOMU_BUILD="ci ${GITHUB_SHA::7} $(date -u '+%m-%d %H:%M')" \
            --dart-define=TOOMU_TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/toomu-arm64-v8a.apk
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/toomu-armeabi-v7a.apk
          fi
          (cd build && zip -qr ../dist/debug-symbols-android.zip symbols)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: toomu-android
          path: dist/*
          retention-days: 14

  # iOS: off. The .ipa is unsigned and iPhones only install signed apps
  # (AltStore / Sideloadly can sign it with a free Apple ID; installing it
  # straight needs the Apple Developer Program and signing here). To turn it
  # back on, uncomment this job and add ios to the release job's needs.
# ios:
#   runs-on: macos-latest
#   timeout-minutes: 60
#   steps:
#     - uses: actions/checkout@v4
#
#     - uses: subosito/flutter-action@v2
#       with:
#         flutter-version: ${{ env.FLUTTER_VERSION }}
#         channel: stable
#         cache: true
#
#     - run: flutter pub get
#
#     # Unsigned: install with your own Apple signing (e.g. AltStore /
#     # Sideloadly) — App Store distribution needs certificates + profiles.
#     - name: Build iOS (no code signing)
#       run: |
#         flutter build ios --release --no-codesign \
#           --obfuscate --split-debug-info=build/symbols-ios \
#           --dart-define=TOOMU_BUILD="ci ${GITHUB_SHA::7} ios"
#         mkdir -p dist/Payload
#         cp -R build/ios/iphoneos/Runner.app dist/Payload/
#         (cd dist && zip -qr toomu-unsigned.ipa Payload && rm -rf Payload)
#         ls -lh dist
#
#     - uses: actions/upload-artifact@v4
#       with:
#         name: toomu-ios
#         path: dist/*
#         retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [check, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.android.outputs.tag }}
        run: |
          tag="$TAG"
          notes="Built by CI from ${GITHUB_SHA::7}."
          [ -f dist/toomu-arm64-v8a.apk ] && notes+=$'\n- toomu-arm64-v8a.apk — most phones'
          [ -f dist/toomu-armeabi-v7a.apk ] && notes+=$'\n- toomu-armeabi-v7a.apk — older 32-bit phones'
          [ -f dist/toomu-unsigned.ipa ] && notes+=$'\n- toomu-unsigned.ipa — iOS, unsigned (YouTube downloads up to 1080p; no TikTok downloads, bubble or PiP)'
          notes+=$'\n- debug-symbols-*.zip — to read crash stack traces'
          # A tag created with the workflow's token doesn't start another run.
          gh release create "$tag" dist/* --target "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" --title "Toomu $tag" --notes "$notes"
