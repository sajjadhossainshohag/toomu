# Builds Toomu automatically.
#  - Android APKs: every push to main or by hand (arm64 only, for speed);
#    every v* tag (arm64 + armv7). Analyze, the Dart tests (3 shards) and
#    the Kotlin tests run alongside the builds, each its own job; any
#    failure stops the release.
#  - Windows x64 (zip): every build, alongside Android.
#  - Every successful build of main publishes a GitHub Release under a new
#    tag (vYYYY.MM.DD-HHMM, Bangladesh time) with the APK; a pushed v* tag
#    publishes one under that tag with all APKs. The release doesn't wait for
#    the slower Windows build: that job attaches its zip when it's done.
#  - "[skip build]" in the pushed commit's message: only the checks run (no
#    APK, Windows build or release), e.g. for a change already tested on a
#    phone with a local build. Tags always build. "[skip ci]" skips it all.
#
# Release signing (optional, recommended — phones only update an app signed
# with the same key), repository Secrets:
#   ANDROID_KEYSTORE_BASE64  base64 of your .jks   (base64 -i upload.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# A newer push cancels an older run of the same kind only: a "[skip build]"
# push (checks only) never cancels a build that's about to release.
concurrency:
  group: build-${{ github.ref }}-${{ github.ref_type != 'tag' && contains(github.event.head_commit.message, '[skip build]') && 'checks' || 'build' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.1'

jobs:
  # Checks run as parallel jobs: analyze, the Dart tests (split in shards)
  # and the Kotlin tests, so none waits for another.
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub

  # Dart tests in TEST_SHARDS jobs at once, split by test file (each file is
  # compiled once, in one shard; package:test's --total-shards would
  # compile every file in every shard). Each job runs its files on all of
  # the runner's CPU cores (flutter's default leaves some idle).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # show every failing shard, not just the first
      matrix:
        shard: [0, 1, 2]
    env:
      TEST_SHARDS: 3
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Tests (shard ${{ matrix.shard }} of ${{ env.TEST_SHARDS }})
        run: |
          files=$(tool/test_shard.sh "${{ matrix.shard }}" "$TEST_SHARDS")
          echo "$files"
          flutter test --no-pub --concurrency="$(nproc)" $files

  # Kotlin unit tests (android/app/src/test), e.g. the yt-dlp file repair.
  # android/gradlew isn't in git: --config-only has Flutter write it
  # (and Gradle's settings) without building anything.
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Android unit tests
        run: |
          flutter build apk --config-only
          cd android && ./gradlew :app:testDebugUnitTest

  # The release tag, shared by the Android and Windows builds: the app compares it with GitHub's latest
  # release to offer updates.
  tag:
    if: github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[skip build]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(TZ=Asia/Dhaka date '+%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"
          fi

  android:
    # Skipped by "[skip build]" (see the top); the release then skips too.
    if: github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[skip build]')
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ needs.tag.outputs.tag }}
    env:
      PLATFORMS: ${{ startsWith(github.ref, 'refs/tags/v') && 'android-arm,android-arm64' || 'android-arm64' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Saves Gradle's caches after every main build (setup-java's cache only
      # saved when the Gradle files changed), so tasks such as R8 are reused
      # when only Dart code changed.
      - uses: gradle/actions/setup-gradle@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Release key (if configured)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APKs are signed with a CI debug key (phones can't update a build signed differently)."
          fi

      - run: flutter pub get

      - name: Build APKs (trimmed, obfuscated; see tool/build_release.sh)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform "$PLATFORMS" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=TOOMU_BUILD="ci ${GITHUB_SHA::7} $(date -u '+%m-%d %H:%M')" \
            --dart-define=TOOMU_TAG="${{ needs.tag.outputs.tag }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/toomu-arm64-v8a.apk
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/toomu-armeabi-v7a.apk
          fi
          (cd build && zip -qr ../dist/debug-symbols-android.zip symbols)
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: toomu-android
          path: dist/*
          retention-days: 14

  # Windows x64: the app folder zipped (unzip anywhere, run toomu.exe).
  # yt-dlp, FFmpeg and Deno download on first launch (WindowsYtDlp).
  windows:
    if: github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[skip build]')
    needs: tag
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # attach the zip to the release
      actions: read # see whether the release job ran
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Windows
        run: |
          flutter build windows --release \
            --obfuscate --split-debug-info=build/symbols-windows \
            --dart-define=TOOMU_BUILD="ci ${GITHUB_SHA::7} windows $(date -u '+%m-%d %H:%M')" \
            --dart-define=TOOMU_TAG="${{ needs.tag.outputs.tag }}"
          mkdir -p dist
          (cd build/windows/x64/runner/Release && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/dist/toomu-windows-x64.zip" .)
          (cd build && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/dist/debug-symbols-windows.zip" symbols-windows)
          ls -lh dist

      # The installer: same files, plus Start menu / desktop shortcuts and an uninstaller. Its own step that may
      # fail: the zip is attached either way.
      - name: Windows installer
        continue-on-error: true
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then choco install innosetup -y --no-progress > /dev/null; fi
          # Git Bash would turn the /D options into paths.
          MSYS_NO_PATHCONV=1 "$iscc" /Q \
            "/DAppVersion=${TAG#v}" \
            "/DSourceDir=$GITHUB_WORKSPACE\build\windows\x64\runner\Release" \
            "/DOutputDir=$GITHUB_WORKSPACE\dist" \
            windows\\installer\\toomu.iss
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: toomu-windows
          path: dist/*
          retention-days: 14

      # The release job publishes once Android and the checks pass, usually
      # before this build ends; this waits for it, then adds the zip.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          tag=
          for _ in $(seq 120); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && tag="$TAG"
            [ -n "$tag" ] && break
            state=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.name == "release") | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success") ;; # published a moment ago: look again
              completed*)
                echo "::warning::No release for this build (release job: $state); the zip is only a workflow artifact."
                exit 0 ;;
            esac
            sleep 10
          done
          if [ -z "$tag" ]; then echo "::error::The release never appeared."; exit 1; fi
          gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          notes=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          added=$notes
          lines=('- toomu-windows-x64.zip — Windows 10/11 portable (unzip, run toomu.exe)')
          if [ -f dist/toomu-windows-setup.exe ]; then
            lines=('- toomu-windows-setup.exe — Windows 10/11 installer (Start menu shortcut, uninstall from Settings)' "${lines[@]}")
          fi
          for line in "${lines[@]}"; do
            case "$added" in *"$line"*) ;; *) added+=$'\n'"$line" ;; esac
          done
          if [ "$added" != "$notes" ]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$added"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [analyze, test, kotlin, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: toomu-android
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.android.outputs.tag }}
        run: |
          tag="$TAG"
          notes="Built by CI from ${GITHUB_SHA::7}."
          [ -f dist/toomu-arm64-v8a.apk ] && notes+=$'\n- toomu-arm64-v8a.apk — most phones'
          [ -f dist/toomu-armeabi-v7a.apk ] && notes+=$'\n- toomu-armeabi-v7a.apk — older 32-bit phones'
          notes+=$'\n- debug-symbols-*.zip — to read crash stack traces'
          # A tag created with the workflow's token doesn't start another run.
          gh release create "$tag" dist/* --target "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" --title "Toomu $tag" --notes "$notes" --generate-notes
